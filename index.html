<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranked Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: summary tiles, then one sortable leaderboard; each row opens its own update panel */
  --bg:#eef0f4; --surface:#ffffff; --soft:#f5f6f9; --ink:#151821; --muted:#5b6372; --line:#dadee6;
  --accent:#2457d6; --on-accent:#ffffff; --good:#17845a; --bad:#b9432f;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f14; --surface:#151821; --soft:#1b1f2a; --ink:#e8ebf1; --muted:#99a1b0; --line:#2a303d;
    --accent:#7aa2ff; --on-accent:#0d0f14; --good:#45c98f; --bad:#ff806b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f14; --surface:#151821; --soft:#1b1f2a; --ink:#e8ebf1; --muted:#99a1b0; --line:#2a303d;
  --accent:#7aa2ff; --on-accent:#0d0f14; --good:#45c98f; --bad:#ff806b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1260px;margin:0 auto;padding:28px 20px 60px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:700 30px/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.status{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .v{font:600 26px/1.2 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.tile .n{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:500 14px var(--body);border-radius:7px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--bad)}
button.small{padding:2px 8px;font-size:13px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th.num,td.num{text-align:right}
tr.open>td{background:var(--soft)}
.rank{font:600 15px var(--display);color:var(--muted);width:28px}
.season{font-size:14px;white-space:nowrap}
.nowrap{white-space:nowrap}
.pname{font-weight:600}
.handle{font-size:13px;color:var(--muted);white-space:nowrap}
.chip{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-right:6px;vertical-align:1px}
.chip.ex{border-color:var(--accent);color:var(--accent)}
.big{font:600 17px var(--display)}
.pct{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{width:48px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;flex:none}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--surface)}
.good{color:var(--good)} .bad{color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:0}
.actions{display:flex;gap:6px;justify-content:flex-end;align-items:center;white-space:nowrap}
a.link{color:var(--accent);text-decoration:none;font-size:14px;padding:6px 4px}
a.link:hover{text-decoration:underline}
tr.detail>td{padding:0;background:var(--soft)}
.inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;padding:18px 16px 22px}
@media (max-width:780px){.inner{grid-template-columns:1fr}}
h3{font:600 15px var(--display);margin:0;letter-spacing:.02em}
.form{display:grid;gap:10px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;flex:1 1 140px;min-width:0}
.field input,.field select,.field textarea{width:100%}
textarea{min-height:70px;resize:vertical}
.err{font-size:13px;color:var(--bad);margin:0}
.err:empty{display:none}
.sep{border:0;border-top:1px solid var(--line);margin:8px 0 2px}
.hist{font-size:14px;margin-top:8px}
.hist{width:100%}
.hist th,.hist td{padding:6px 6px}
svg.spark{display:block;max-width:420px}
svg.spark text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);background:var(--soft)}
.addform{padding:16px;border-bottom:1px solid var(--line);background:var(--soft)}
.io{padding:16px;border-bottom:1px solid var(--line);background:var(--soft);display:grid;gap:10px}
.io textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{padding:34px 16px;color:var(--muted);text-align:center}
footer{font-size:13px;color:var(--muted);max-width:75ch}
footer p{margin:0 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.rankcell{white-space:nowrap}
.rankcell .rr{font-size:13px;color:var(--muted)}
.chip.live{border-color:var(--good);color:var(--good)}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.errline{font-size:13px;color:var(--bad);margin-top:2px;white-space:normal;max-width:34ch}
.loading{color:var(--muted);font-size:13px}
.weekly th.wk{text-align:center;white-space:nowrap}
.weekly th.wk .d{display:block;font-size:11px;letter-spacing:0;text-transform:none;font-weight:500}
.weekly td.wk{text-align:center;min-width:92px}
.weekly td.wk.now{background:var(--soft)}
.weekly .wn{font:600 18px/1.1 var(--display);font-variant-numeric:tabular-nums}
.weekly .wl{font-size:12px;color:var(--muted);white-space:nowrap}
.wbar{display:flex;height:4px;width:56px;margin:4px auto 0;border-radius:2px;overflow:hidden;background:var(--line)}
.wbar i{display:block;height:100%}
.weekly tfoot td{font-weight:600;border-bottom:0}
.fixmark{color:var(--accent)}
.weekly .wn{display:inline-flex;align-items:center;gap:6px}
.medal{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font:700 11px/1 var(--body);flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.medal.m1{background:#e0b12f;color:#3d2c00}
.medal.m2{background:#b7c0cb;color:#262c33}
.medal.m3{background:#c27d45;color:#2e1606}
.medal.sm{width:15px;height:15px;font-size:9px}
.weekly td.medaled.m1{box-shadow:inset 0 3px 0 #e0b12f}
.weekly td.medaled.m2{box-shadow:inset 0 3px 0 #b7c0cb}
.weekly td.medaled.m3{box-shadow:inset 0 3px 0 #c27d45}
.tally{display:flex;gap:8px;margin-top:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl{display:inline-flex;align-items:center;gap:3px}
.rimg{display:block;flex:none;object-fit:contain}
.rankcell{display:inline-flex;align-items:center;gap:6px}
.ladderrank{display:flex;align-items:center;gap:10px;white-space:nowrap}
.ladderrank.small{gap:6px;font-size:14px}
.ladder .rr{font-size:13px;color:var(--muted)}
.pklabel{display:none}
.streak{display:inline-block;font:600 11px/1.4 var(--body);padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.streak.hot{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good)}
.streak.cold{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent)}
.awardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px}
.award{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--soft);display:grid;gap:2px;align-content:start}
.award .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.award .who{font:600 20px/1.25 var(--display);margin-top:4px;text-wrap:balance}
.award .who.none{font:500 14px var(--body);color:var(--muted)}
.award .v{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.award .n{font-size:13px;color:var(--muted)}

.who-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.who-txt{min-width:0}
.avatar{display:block;flex:none;border-radius:8px;object-fit:cover;background:var(--soft)}
.avatar.ph{display:inline-flex;align-items:center;justify-content:center;font:600 15px var(--display);color:var(--muted);border:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:16px}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.pbanner{height:76px;background:var(--soft)}
.pbanner img{display:block;width:100%;height:100%;object-fit:cover}
.pbody{padding:12px 14px 14px;display:grid;gap:12px}
.phead{display:flex;align-items:center;gap:10px}
.phead .avatar{margin-top:-30px;border:3px solid var(--surface);border-radius:10px;box-sizing:content-box}
.prank{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap}
.prank .sub,.srow .sub{font-size:12px;font-weight:400;color:var(--muted)}
.pcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pcols .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.srow .nm>div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.srow .pv{font:600 14px var(--display);font-variant-numeric:tabular-nums}
.pvw{text-align:right;font-variant-numeric:tabular-nums}
.ag{display:block;width:24px;height:24px;border-radius:5px;background:var(--soft);object-fit:contain}
.mp{display:block;width:44px;height:22px;border-radius:4px;background:var(--soft);object-fit:cover}
.pfoot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pfoot b{color:var(--ink);font-weight:600}
.mapcell{display:flex;align-items:center;gap:10px}
.mapcell .mp{width:64px;height:28px}

/* ---------- phones ---------- */
@media (max-width:700px){
  .wrap{padding:18px 12px 40px;gap:16px}
  h1{font-size:24px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:12px}
  .tile .v{font-size:22px}
  .toolbar{padding:10px 12px}
  .tablewrap{overflow-x:visible}
  /* leaderboard rows become cards */
  .lb>thead{display:none}
  .lb,.lb>tbody{display:block;width:100%}
  .lb tr.lbrow.open{background:var(--soft)}
  .lb tr.lbrow.open>td{background:transparent}
  .lb>tbody>tr.lbrow{display:grid;grid-template-columns:22px repeat(3,minmax(0,1fr));grid-template-areas:"n p p a" "n r r r" "n w g c" "n d d d";gap:8px 10px;padding:12px;border-bottom:1px solid var(--line)}
  .lb tr.lbrow>td{display:block;padding:0;border:0;text-align:left}
  .lb .c-n{grid-area:n} .lb .c-p{grid-area:p;min-width:0} .lb tr.lbrow>td.c-act{display:none} .lb .c-r{grid-area:r}
  .lb .c-c .bar{display:none}
  .lb .c-w{grid-area:w} .lb .c-g{grid-area:g} .lb .c-c{grid-area:c} .lb .c-d{grid-area:d} .lb .c-a{grid-area:a}
  .lb td[data-label]::before,.dt td[data-label]::before{content:attr(data-label);display:block;font:500 11px/1.4 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .lb .pct{justify-content:flex-start}
  .lb .c-a a.link{display:none}
  .lb .handle{white-space:normal}
  .lb tr.detail,.lb tr.detail>td{display:block}
  /* rank ladder rows become cards */
  .ld thead{display:none}
  .ld,.ld tbody{display:block;width:100%}
  .ld tr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"n p rr" "n rk lc" "n pk pk";gap:6px 10px;padding:12px;border-bottom:1px solid var(--line)}
  .ld tr>td{display:block;padding:0;border:0}
  .ld .l-n{grid-area:n} .ld .l-p{grid-area:p;min-width:0} .ld .l-rk{grid-area:rk} .ld .l-rr{grid-area:rr} .ld .l-lc{grid-area:lc;align-self:center} .ld .l-pk{grid-area:pk} .ld .l-msg{grid-column:2 / 4}
  .pklabel{display:inline}
  /* duos rows become cards */
  .dt thead{display:none}
  .dt,.dt tbody{display:block;width:100%}
  .dt tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;border-bottom:1px solid var(--line)}
  .dt tr>td{display:block;padding:0;border:0;text-align:left}
  .dt .c-duo,.dt td[colspan]{grid-column:1 / -1}
  .dt td:last-child{display:none}
  .dt .pct{justify-content:flex-start}
  /* weekly table keeps its grid but scrolls sideways with the player column pinned */
  .weekly .tablewrap{overflow-x:auto}
  .weekly th:first-child,.weekly td:first-child{display:none}
  .weekly th:nth-child(2),.weekly td:nth-child(2){position:sticky;left:0;z-index:1;background:var(--surface);min-width:110px;box-shadow:1px 0 0 var(--line)}
  .weekly td.wk{min-width:76px;padding:10px 6px}
  .awardgrid{grid-template-columns:1fr 1fr;padding:12px;gap:8px}
  .pgrid{grid-template-columns:1fr;padding:12px}
  .mt thead{display:none}
  .mt,.mt tbody{display:block;width:100%}
  .mt tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;border-bottom:1px solid var(--line)}
  .mt tr>td{display:block;padding:0;border:0;text-align:left}
  .mt .m-name,.mt td[colspan],.mt td:last-child{grid-column:1 / -1}
  .mt td[data-label]::before{content:attr(data-label);display:block;font:500 11px/1.4 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .mt .pct{justify-content:flex-start}
  .mt .pct .bar{display:none}
  .award{padding:12px}
  .award .who{font-size:17px}
}
.hbtn{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;border-radius:4px;padding:1px 3px}
.hbtn:hover{color:var(--ink)}
.hbtn[aria-pressed="true"]{color:var(--accent)}
.hbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.weekly .zero{color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
const SEEN = "ranked-tracker-seen-v2";
const LS = "ranked-tracker-local-v2";
const REGIONS = [["na","North America"],["eu","Europe"],["ap","Asia Pacific"],["kr","Korea"],["latam","Latin America"],["br","Brazil"]];
const enc = s => encodeURIComponent(String(s).trim());
const GAMES = {
  valorant:{label:"Valorant", hint:"Riot ID, e.g. Name#NA1", url:h=>`https://tracker.gg/valorant/profile/riot/${enc(h)}/overview?playlist=competitive`},
  lol:{label:"League of Legends", hint:"Riot ID, e.g. Name#NA1", url:h=>`https://tracker.gg/lol/profile/riot/${enc(h)}/overview`},
  cs2:{label:"Counter-Strike 2", hint:"Steam ID or custom URL name", url:h=>`https://tracker.gg/cs2/profile/steam/${enc(h)}/overview`},
  marvel:{label:"Marvel Rivals", hint:"In-game name", url:h=>`https://tracker.gg/marvel-rivals/profile/ign/${enc(h)}/overview`},
  overwatch:{label:"Overwatch 2", hint:"BattleTag, e.g. Name#1234", url:h=>`https://tracker.gg/overwatch/profile/battlenet/${enc(h)}/overview`},
  other:{label:"Other game", hint:"Name on tracker.gg (paste the profile link too)", url:()=>""}
};

const root = document.getElementById("root");
let state = {v:2, updatedAt:"", players:[]};
let publishedAt = "";
let loaded = false;
const live = {};   // id -> {status:"loading"|"ok"|"error", data, message}
const weekly = {}; // id -> {status, games:[{start,result,...}], message}
const account = {}; // id -> {card:{small,wide,large}, level}
const assets = {agents:{}, maps:{}}; // lowercased name -> icon URL, from valorant-api.com
let seen = {};
try { seen = JSON.parse(localStorage.getItem(SEEN) || "{}") || {}; } catch(e) { seen = {}; }
const base = JSON.parse(JSON.stringify(seen)); // what this browser saw before this visit
const ui = {sort:"pct", game:"all", open:null, adding:false, io:false, confirmDel:null, status:"Loading players…", refreshedAt:null, weeks:6, wsort:"total", wfix:false, awardWeek:0, duoScope:"act", statScope:"act"};
try { const w = Number(localStorage.getItem("ranked-tracker-weeks")); if ([4,6,8,12].includes(w)) ui.weeks = w; } catch(e) {}
let savedWsort = null; try { savedWsort = localStorage.getItem("ranked-tracker-wsort"); } catch(e) {}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const uid = () => "p" + Math.random().toString(36).slice(2, 9);
const fmtDate = d => { if (!d) return "—"; const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd).toLocaleDateString(undefined, {month:"short", day:"numeric"}); };
const fmtTime = iso => new Date(iso).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
const fmtPct = x => x == null ? "—" : x.toFixed(1) + "%";
const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
const find = id => state.players.find(p => p.id === id);
const isAuto = p => p.game === "valorant" && /#/.test(p.handle || "");
const profileUrl = p => p.link ? p.link : (p.handle ? (GAMES[p.game] || GAMES.other).url(p.handle) : "");
const pctClass = x => x == null ? "" : x >= 55 ? "good" : x < 45 ? "bad" : "";
const pctColor = x => x == null ? "var(--line)" : x >= 55 ? "var(--good)" : x < 45 ? "var(--bad)" : "var(--accent)";
const regionLabel = r => (REGIONS.find(x => x[0] === r) || [r, r])[1];

function cleanFix(f){
  const out = {};
  if (f && typeof f === "object") Object.keys(f).forEach(k => {
    const v = f[k];
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v && [v.W, v.L, v.D].every(n => Number.isInteger(n) && n >= 0 && n < 500)) out[k] = {W:v.W, L:v.L, D:v.D};
  });
  return out;
}
/* ---------- match history helpers ---------- */
function gamesOf(p){ return ((weekly[p.id] && weekly[p.id].games) || []).slice().sort((a,b) => b.start.localeCompare(a.start)); }
function avatarHtml(p, size){
  const a = account[p.id], src = a && a.card && a.card.small;
  return src ? `<img class="avatar" src="${esc(src)}" width="${size}" height="${size}" alt="" loading="lazy">`
    : `<span class="avatar ph" style="width:${size}px;height:${size}px">${esc((p.name || "?").slice(0, 1).toUpperCase())}</span>`;
}
function currentAct(){
  const newest = state.players.filter(isAuto).flatMap(p => gamesOf(p)).sort((a,b) => b.start.localeCompare(a.start))[0];
  return newest ? newest.act : null;
}
function scopeGames(p, scope){ const g = gamesOf(p); if (scope === "all") return g; const act = currentAct(); return g.filter(x => x.act === act); }
function topBy(games, key){
  const m = new Map();
  games.forEach(g => { const k = g[key]; if (!k) return; const o = m.get(k) || {name:k, W:0, L:0, D:0, n:0}; o[g.result]++; o.n++; m.set(k, o); });
  return [...m.values()].sort((a,b) => b.n - a.n || b.W / b.n - a.W / a.n);
}
const agentImg = n => { const u = assets.agents[String(n).toLowerCase()]; return u ? `<img class="ag" src="${esc(u)}" width="24" height="24" alt="" loading="lazy">` : '<span class="ag ph"></span>'; };
const mapImg = n => { const u = assets.maps[String(n).toLowerCase()]; return u ? `<img class="mp" src="${esc(u)}" width="44" height="22" alt="" loading="lazy">` : '<span class="mp ph"></span>'; };
function scopeSelect(id){
  const act = currentAct();
  return `<label for="${id}">Games from</label><select id="${id}" data-scope="1"><option value="act"${ui.statScope === "act" ? " selected" : ""}>This act${act ? " (" + esc(act) + ")" : ""}</option><option value="all"${ui.statScope === "all" ? " selected" : ""}>All stored games</option></select>`;
}

function streakOf(p){
  const g = gamesOf(p); if (!g.length || g[0].result === "D") return null;
  let n = 0; for (const x of g) { if (x.result === g[0].result) n++; else break; }
  return n >= 2 ? {r:g[0].result, n} : null;
}
function streakHtml(p){
  if (!isAuto(p)) return "";
  const s = streakOf(p); if (!s) return "";
  return s.r === "W" ? `<span class="streak hot" title="${s.n} ranked wins in a row">🔥 ${s.n}W streak</span>` : `<span class="streak cold" title="${s.n} ranked losses in a row">🧊 ${s.n}L streak</span>`;
}

/* ---------- rank tiers and icons ---------- */
const TIERS = ["Iron","Bronze","Silver","Gold","Platinum","Diamond","Ascendant","Immortal"];
function tierId(name){
  if (!name) return 0;
  if (/radiant/i.test(name)) return 27;
  const m = String(name).trim().match(/^([A-Za-z]+)\s*(\d)$/); if (!m) return 0;
  const i = TIERS.findIndex(t => t.toLowerCase() === m[1].toLowerCase());
  return i < 0 ? 0 : 3 + i * 3 + (Number(m[2]) - 1);
}
// Rank icons are Riot Games assets, served by valorant-api.com.
const rankIcon = (name, size) => {
  const id = tierId(name);
  return `<img class="rimg" src="https://media.valorant-api.com/competitivetiers/03621f52-342b-cf4e-4f86-9350a49c6d04/${id}/largeicon.png" width="${size}" height="${size}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
};

function normalize(data){
  const list = data && Array.isArray(data.players) ? data.players : Array.isArray(data) ? data : [];
  return list.filter(p => p && typeof p === "object" && !p.example).map(p => ({
    id: String(p.id || uid()), name: String(p.name || p.handle || "Player"),
    game: GAMES[p.game] ? p.game : "other", handle: String(p.handle || ""), link: String(p.link || ""),
    region: REGIONS.some(r => r[0] === p.region) ? p.region : "na", platform: p.platform === "console" ? "console" : "pc",
    season: String(p.season || "Current season"),
    weekFix: cleanFix(p.weekFix),
    snaps: (Array.isArray(p.snaps) ? p.snaps : []).filter(s => s && /^\d{4}-\d{2}-\d{2}$/.test(s.d) && Number.isInteger(s.w) && Number.isInteger(s.p) && s.w >= 0 && s.w <= s.p).map(s => ({d:s.d, season:String(s.season || p.season || "Current season"), w:s.w, p:s.p}))
  }));
}

/* ---------- stats ---------- */
function manualStats(p){
  const snaps = p.snaps.filter(x => x.season === p.season).sort((a,b) => a.d.localeCompare(b.d));
  const last = snaps[snaps.length-1] || null, prev = snaps[snaps.length-2] || null;
  const r = {kind:"manual", snaps, last, prev, act:p.season, w:null, p:null, pct:null, dW:null, dP:null, date:null};
  if (last) { r.w = last.w; r.p = last.p; r.pct = last.p ? last.w/last.p*100 : null; r.date = last.d; }
  if (last && prev) { r.dW = last.w - prev.w; r.dP = last.p - prev.p; }
  return r;
}
function autoStats(p){
  const L = live[p.id] || {status:"loading"};
  const r = {kind:"auto", status:L.status, message:L.message, act:null, w:null, p:null, pct:null, dW:null, dP:null, rank:null, rr:null, seasons:[]};
  if (L.status !== "ok") return r;
  const d = L.data; r.seasons = d.seasons || [];
  const cur = r.seasons[r.seasons.length-1];
  if (cur) { r.act = cur.act; r.w = cur.wins; r.p = cur.games; r.pct = cur.games ? cur.wins/cur.games*100 : null; }
  r.rank = d.rank; r.rr = d.rr; r.gamesNeeded = d.gamesNeeded; r.peak = d.peak; r.lastChange = d.lastChange;
  const s = base[p.id];
  if (s && s.act === r.act && r.p != null && r.p >= s.p) { r.dW = r.w - s.w; r.dP = r.p - s.p; r.seenAt = s.at; }
  return r;
}
const stats = p => isAuto(p) ? autoStats(p) : manualStats(p);

/* "Since your last visit": the saved baseline moves forward once it's 3+ hours old. */
function updateSeen(p, data){
  const cur = (data.seasons || [])[data.seasons.length-1]; if (!cur) return;
  const s = seen[p.id], now = Date.now();
  if (!s || s.act !== cur.act || cur.games < s.p || now - s.at > 3*3600*1000) seen[p.id] = {act:cur.act, w:cur.wins, p:cur.games, at:now};
}

/* ---------- live loading ---------- */
async function fetchOne(p, fresh){
  const [name, tag] = p.handle.split("#");
  live[p.id] = {status:"loading"};
  const qs = new URLSearchParams({name:name.trim(), tag:(tag || "").trim(), region:p.region, platform:p.platform});
  if (fresh) qs.set("r", String(Math.floor(Date.now()/60000)));
  try {
    const res = await fetch("/api/stats?" + qs.toString());
    let body = null; try { body = await res.json(); } catch(e) {}
    if (res.ok && body && Array.isArray(body.seasons)) live[p.id] = {status:"ok", data:body};
    else live[p.id] = {status:"error", message: body && body.message ? body.message : (res.status === 404 ? "Stats service not found. Is api/stats.js in the repo?" : "Couldn't load stats (" + res.status + ").")};
  } catch(e) { live[p.id] = {status:"error", message:"Couldn't reach the stats service. Check your connection."}; }
}

async function fetchWeekly(p, fresh){
  const [name, tag] = p.handle.split("#");
  weekly[p.id] = {status:"loading", games:(weekly[p.id] && weekly[p.id].games) || []};
  const qs = new URLSearchParams({view:"weekly", name:name.trim(), tag:(tag || "").trim(), region:p.region});
  if (fresh) qs.set("r", String(Math.floor(Date.now()/60000)));
  try {
    const res = await fetch("/api/stats?" + qs.toString());
    let body = null; try { body = await res.json(); } catch(e) {}
    if (res.ok && body && Array.isArray(body.games)) weekly[p.id] = {status:"ok", games:body.games};
    else weekly[p.id] = {status:"error", games:[], message: body && body.message ? body.message : "Couldn't load match history (" + res.status + ")."};
  } catch(e) { weekly[p.id] = {status:"error", games:[], message:"Couldn't reach the stats service."}; }
}
async function fetchAccount(p){
  if (account[p.id] && account[p.id].card) return;
  const [name, tag] = p.handle.split("#");
  try {
    const res = await fetch("/api/stats?" + new URLSearchParams({view:"account", name:name.trim(), tag:(tag || "").trim(), region:p.region}).toString());
    const body = await res.json();
    if (res.ok && body && body.card) account[p.id] = body;
  } catch(e) {}
}
async function loadAssets(){
  try {
    const [a, m] = await Promise.all([
      fetch("https://valorant-api.com/v1/agents?isPlayableCharacter=true").then(r => r.json()),
      fetch("https://valorant-api.com/v1/maps").then(r => r.json())
    ]);
    (a.data || []).forEach(x => { if (x.displayName && x.displayIcon) assets.agents[x.displayName.toLowerCase()] = x.displayIcon; });
    (m.data || []).forEach(x => { if (x.displayName && (x.listViewIcon || x.splash)) assets.maps[x.displayName.toLowerCase()] = x.listViewIcon || x.splash; });
    render();
  } catch(e) {}
}
const loadPlayer = (p, fresh) => Promise.all([fetchOne(p, fresh), fetchWeekly(p, fresh), fetchAccount(p)]);

/* ---------- weeks: Monday 12:00 AM to Sunday 11:59 PM, Pacific time ---------- */
const PT = new Intl.DateTimeFormat("en-US", {timeZone:"America/Los_Angeles", year:"numeric", month:"2-digit", day:"2-digit", weekday:"short"});
const WD = {Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6};
function weekKey(date){
  const o = {}; PT.formatToParts(date).forEach(x => { o[x.type] = x.value; });
  return new Date(Date.UTC(+o.year, +o.month - 1, +o.day - WD[o.weekday])).toISOString().slice(0, 10);
}
function addDays(key, n){ const [y,m,d] = key.split("-").map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0, 10); }
function shortDay(key){ const [y,m,d] = key.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)).toLocaleDateString(undefined, {month:"short", day:"numeric", timeZone:"UTC"}); }
function weekRange(key){
  const end = addDays(key, 6);
  return key.slice(5, 7) === end.slice(5, 7) ? `${shortDay(key)}–${Number(end.slice(8))}` : `${shortDay(key)}–${shortDay(end)}`;
}

if (savedWsort && /^week\d+$/.test(savedWsort)) ui.wsort = addDays(weekKey(new Date()), -7 * Number(savedWsort.slice(4)));

let refreshing = false;
async function refreshAll(fresh){
  if (refreshing) return; refreshing = true;
  const list = state.players.filter(isAuto);
  list.forEach(p => { live[p.id] = {status:"loading"}; weekly[p.id] = {status:"loading", games:(weekly[p.id] && weekly[p.id].games) || []}; });
  ui.status = list.length ? "Loading stats…" : statusIdle(); render();
  const queue = list.slice();
  async function worker(){ while (queue.length) { const p = queue.shift(); await loadPlayer(p, fresh); render(); } }
  await Promise.all([worker(), worker()]);
  // Save baselines after showing this visit's changes.
  list.forEach(p => { if (live[p.id] && live[p.id].status === "ok") updateSeen(p, live[p.id].data); });
  try { localStorage.setItem(SEEN, JSON.stringify(seen)); } catch(e) {}
  refreshing = false;
  if (list.length) { ui.refreshedAt = new Date().toISOString(); }
  ui.status = statusIdle(); render();
}
function statusIdle(){
  const errs = state.players.filter(p => isAuto(p) && live[p.id] && live[p.id].status === "error").length;
  if (errs) return `${errs} player${errs === 1 ? "" : "s"} couldn't load`;
  return ui.refreshedAt ? "Stats updated " + fmtTime(ui.refreshedAt) : "Ready";
}

/* ---------- rendering ---------- */
function rows(){
  let list = state.players.map(p => ({p, s:stats(p)}));
  if (ui.game !== "all") list = list.filter(r => r.p.game === ui.game);
  const n = v => v == null ? -1 : v;
  list.sort((a,b) => {

    if (ui.sort === "wins") return n(b.s.w) - n(a.s.w) || n(b.s.pct) - n(a.s.pct);
    if (ui.sort === "games") return n(b.s.p) - n(a.s.p) || n(b.s.pct) - n(a.s.pct);
    return n(b.s.pct) - n(a.s.pct) || n(b.s.p) - n(a.s.p);
  });
  return list;
}

function regionOptions(sel){ return REGIONS.map(([k,l]) => `<option value="${k}"${k === sel ? " selected" : ""}>${esc(l)}</option>`).join(""); }

function tilesHtml(){

function spark(points, label){
  if (points.length < 2) return "";
  const W = 360, H = 104, pl = 34, pr = 12, pt = 8, pb = 20;
  const xs = i => pl + i * (W - pl - pr) / (points.length - 1);
  const ys = v => pt + (1 - v / 100) * (H - pt - pb);
  const pts = points.map((q,i) => [xs(i), ys(q.pct)]);
  const line = pts.map((q,i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  const area = `${line} L${pts[pts.length-1][0].toFixed(1)} ${ys(0)} L${pts[0][0].toFixed(1)} ${ys(0)} Z`;
  const last = pts[pts.length-1], lastPct = points[points.length-1].pct;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}">
    <line x1="${pl}" x2="${W-pr}" y1="${ys(100)}" y2="${ys(100)}" stroke="var(--line)"/>
    <line x1="${pl}" x2="${W-pr}" y1="${ys(50)}" y2="${ys(50)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="${pl}" x2="${W-pr}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--line)"/>
    <text x="${pl-6}" y="${ys(100)+3}" text-anchor="end">100%</text>
    <text x="${pl-6}" y="${ys(50)+3}" text-anchor="end">50%</text>
    <text x="${pl-6}" y="${ys(0)+3}" text-anchor="end">0%</text>
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>
    <text x="${(last[0]-6).toFixed(1)}" y="${Math.max(last[1]-8, 10).toFixed(1)}" text-anchor="end" style="fill:var(--ink);font-weight:600">${lastPct.toFixed(1)}%</text>
    <text x="${pl}" y="${H-5}">${esc(points[0].label)}</text>
    <text x="${W-pr}" y="${H-5}" text-anchor="end">${esc(points[points.length-1].label)}</text>
  </svg>`;
}

    else if (s.status === "error") { delta = '<span class="note">—</span>'; sub = `<div class="errline">${esc(s.message)}</div>`; }
    else {
      rankCell = s.rank ? `<span class="rankcell">${rankIcon(s.rank, 24)}<span>${esc(s.rank)}${s.rr != null ? ` <span class="rr">${s.rr} RR</span>` : ""}</span></span>` : '<span class="note">Unrated</span>';
      delta = deltaHtml(s.dW, s.dP, "First visit");
    }
  } else {
    delta = s.last ? deltaHtml(s.dW, s.prev ? s.dP : null) : '<span class="note">No stats yet</span>';
  }
  const tag = s.kind === "auto" ? (s.status === "error" ? '<span class="chip warn">Not loading</span>' : '<span class="chip live">Auto</span>') : '<span class="chip">Manual</span>';
  return `<tr class="lbrow${open ? " open" : ""}">
    <td class="rank c-n">${i + 1}</td>
    <td class="c-p"><div class="who-wrap">${isAuto(p) ? avatarHtml(p, 36) : ""}<div class="who-txt"><div class="pname">${esc(p.name)} ${streakHtml(p)}</div><div class="handle">${tag}<span class="chip">${esc(g.label)}</span>${esc(p.handle)}</div>${sub}</div></div></td>
    <td class="season c-act">${esc(s.act || (s.kind === "auto" ? "" : p.season)) || '<span class="note">—</span>'}</td>
    <td class="c-r">${rankCell}</td>
    <td class="num big c-w" data-label="Wins">${s.w == null ? "—" : s.w}</td>
    <td class="num big c-g" data-label="Games">${s.p == null ? "—" : s.p}</td>
    <td class="c-c" data-label="Win %"><div class="pct"><span class="big ${pctClass(s.pct)}">${fmtPct(s.pct)}</span><span class="bar" style="--c:${pctColor(s.pct)}"><i style="width:${s.pct == null ? 0 : s.pct.toFixed(1)}%"></i></span></div></td>
    <td class="nowrap c-d" data-label="Since last visit">${delta}</td>
    <td class="c-a"><div class="actions">${url ? `<a class="link" href="${esc(url)}" target="_blank" rel="noopener">tracker.gg</a>` : ""}<button type="button" data-act="toggle" data-id="${p.id}" aria-expanded="${open}">${open ? "Close" : "Details"}</button></div></td>
  </tr>${open ? (s.kind === "auto" ? autoDetail(p, s) : manualDetail(p, s)) : ""}`;
}

function weeklyHtml(){
  const players = state.players.filter(isAuto);
  if (!players.length) return "";
  const cur = weekKey(new Date());
  const weeks = Array.from({length: ui.weeks}, (_, i) => addDays(cur, -7 * i));
  const tally = p => {
    const t = {}; weeks.forEach(k => { t[k] = {W:0, L:0, D:0}; });
    ((weekly[p.id] && weekly[p.id].games) || []).forEach(g => { const k = weekKey(new Date(g.start)); if (t[k]) t[k][g.result]++; });
    // A hand correction sets the minimum for that week, so a game HenrikDev saves later isn't counted twice.
    const fix = p.weekFix || {};
    weeks.forEach(k => { const f = fix[k]; if (f) { const c = t[k]; if (f.W > c.W || f.L > c.L || f.D > c.D) c.fixed = true; c.W = Math.max(c.W, f.W); c.L = Math.max(c.L, f.L); c.D = Math.max(c.D, f.D); } });
    return t;
  };
  const rowsW = players.map(p => ({p, t:tally(p), w:weekly[p.id] || {status:"loading", games:[]}}));
  weeklyCache = {weeks, rows:rowsW};
  rowsW.forEach(r => { r.tot = weeks.reduce((a,k) => ({W:a.W + r.t[k].W, L:a.L + r.t[k].L, D:a.D + r.t[k].D}), {W:0, L:0, D:0}); });
  if (ui.wsort !== "total" && ui.wsort !== "medals" && !weeks.includes(ui.wsort)) ui.wsort = "total";
  const rate = c => { const n = c.W + c.L + c.D; return n ? c.W / n : -1; };
  // Medals: most wins in a column takes gold, then silver and bronze. Equal wins go to the better win rate;
  // players tied on both share the medal. Nobody with 0 wins gets one.
  const places = key => {
    const list = rowsW.map(r => ({id:r.p.id, c:key === "total" ? r.tot : r.t[key]})).filter(x => x.c.W > 0)
      .sort((a,b) => b.c.W - a.c.W || rate(b.c) - rate(a.c));
    const all = new Map(), out = new Map();
    list.forEach((x, i) => { const prev = list[i-1]; all.set(x.id, prev && prev.c.W === x.c.W && rate(prev.c) === rate(x.c) ? all.get(prev.id) : i + 1); });
    all.forEach((pl, id) => { if (pl <= 3) out.set(id, pl); });
    return out;
  };
  const medals = {total: places("total")};
  weeks.forEach(k => { medals[k] = places(k); });
  rowsW.forEach(r => { r.m = [0, 0, 0, 0]; weeks.forEach(k => { if (k === cur) return; const pl = medals[k].get(r.p.id); if (pl) r.m[pl]++; }); });
  const medalScore = r => r.m[1] * 10000 + r.m[2] * 100 + r.m[3];
  const pick = r => ui.wsort === "total" || ui.wsort === "medals" ? r.tot : r.t[ui.wsort];
  rowsW.sort((a,b) => (ui.wsort === "medals" ? medalScore(b) - medalScore(a) : 0) || pick(b).W - pick(a).W || rate(pick(b)) - rate(pick(a)) || b.tot.W - a.tot.W || a.p.name.localeCompare(b.p.name));
  const PLACE = ["", "1st", "2nd", "3rd"];
  const medal = (pl, extra) => `<span class="medal m${pl}${extra || ""}" title="${PLACE[pl]} place" aria-label="${PLACE[pl]} place">${pl}</span>`;
  const medalTally = r => { const parts = [1, 2, 3].filter(pl => r.m[pl]).map(pl => `<span class="tl">${medal(pl, " sm")}×${r.m[pl]}</span>`); return parts.length ? `<div class="tally">${parts.join("")}</div>` : ""; };
  const cell = (c, k, loading, pid) => {
    const n = c.W + c.L + c.D;
    if (!n) return `<td class="wk${k === ui.wsort ? " now" : ""}">${loading === "loading" ? '<span class="loading">…</span>' : loading === "error" ? '<span class="wn zero">—</span>' : '<span class="wn zero">0</span><div class="wl">no games</div>'}</td>`;
    const pl = pid && medals[k] ? medals[k].get(pid) : null;
    return `<td class="wk${k === ui.wsort ? " now" : ""}${pl ? " medaled m" + pl : ""}"><div class="wn">${pl ? medal(pl) : ""}${c.W}</div><div class="wl">${c.W}W–${c.L}L${c.D ? `–${c.D}D` : ""}${c.fixed ? ' <span class="fixmark" title="Corrected by hand">✎</span>' : ""}</div><div class="wbar" aria-hidden="true"><i style="width:${(c.W/n*100).toFixed(1)}%;background:var(--good)"></i><i style="width:${(c.L/n*100).toFixed(1)}%;background:var(--bad)"></i></div></td>`;
  };
  const totals = weeks.map(k => rowsW.reduce((a,r) => ({W:a.W + r.t[k].W, L:a.L + r.t[k].L, D:a.D + r.t[k].D}), {W:0, L:0, D:0}));
  const grand = rowsW.reduce((a,r) => ({W:a.W + r.tot.W, L:a.L + r.tot.L, D:a.D + r.tot.D}), {W:0, L:0, D:0});
  const wkName = (k,i) => i === 0 ? "This week" : i === 1 ? "Last week" : `${i} weeks ago`;
  const arrow = k => ui.wsort === k ? " ▼" : "";
  const errs = rowsW.filter(r => r.w.status === "error");
  return `<section class="panel weekly" aria-label="Wins per week">
    <div class="toolbar">
      <div class="grp"><h3>Ranked wins per week</h3></div>
      <div class="grp"><label for="wsort">Rank by</label><select id="wsort"><option value="total"${ui.wsort === "total" ? " selected" : ""}>Total wins (${ui.weeks} weeks)</option><option value="medals"${ui.wsort === "medals" ? " selected" : ""}>Most medals</option>${weeks.map((k,i) => `<option value="${k}"${ui.wsort === k ? " selected" : ""}>${wkName(k,i)} (${esc(weekRange(k))})</option>`).join("")}</select><label for="weeks">Show</label><select id="weeks">${[4,6,8,12].map(n => `<option value="${n}"${ui.weeks === n ? " selected" : ""}>${n} weeks</option>`).join("")}</select><button type="button" data-act="wfix">${ui.wfix ? "Close" : "Fix a week"}</button></div>
    </div>
    ${ui.wfix ? fixFormHtml(rowsW, weeks) : ""}
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Player</th><th class="wk"><button type="button" class="hbtn" data-act="wsort" data-k="total" aria-pressed="${ui.wsort === "total"}">Total${arrow("total")}</button><span class="d">${ui.weeks} weeks</span></th>${weeks.map((k,i) => `<th class="wk"><button type="button" class="hbtn" data-act="wsort" data-k="${k}" aria-pressed="${ui.wsort === k}">${wkName(k,i)}${arrow(k)}</button><span class="d">${esc(weekRange(k))}</span></th>`).join("")}</tr></thead>
      <tbody>${rowsW.map((r,i) => `<tr><td class="rank">${i + 1}</td><td><div class="pname">${esc(r.p.name)}</div><div class="handle">${esc(r.p.handle)}</div>${medalTally(r)}${r.w.status === "error" ? `<div class="errline">${esc(r.w.message)}</div>` : ""}</td>${cell(r.tot, "total", r.w.status, r.p.id)}${weeks.map(k => cell(r.t[k], k, r.w.status, r.p.id)).join("")}</tr>`).join("")}</tbody>
      ${rowsW.length > 1 ? `<tfoot><tr><td></td><td>Everyone</td>${cell(grand, "total", false)}${totals.map((c,i) => cell(c, weeks[i], false)).join("")}</tr></tfoot>` : ""}
    </table></div>
    <div class="banner" style="border-bottom:0;border-top:1px solid var(--line)"><span>Medals go to the top 3 in wins each week (ties go to the better win rate). The medal count under each name covers finished weeks only. Weeks run Monday 12:00 AM to Sunday 11:59 PM Pacific time. Counts come from the competitive matches HenrikDev has stored for each player. That history builds up as the site is used, so older weeks can be missing games${errs.length ? `. ${errs.length} player${errs.length === 1 ? "" : "s"} couldn't load match history` : ""}.</span></div>
  </section>`;
}

function ladderHtml(){
  const players = state.players.filter(isAuto);
  if (!players.length) return "";
  const rowsL = players.map(p => ({p, s:autoStats(p)}));
  rowsL.sort((a,b) => tierId(b.s.rank) - tierId(a.s.rank) || (b.s.rr ?? -1) - (a.s.rr ?? -1) || a.p.name.localeCompare(b.p.name));
  const top = rowsL[0] && rowsL[0].s.rank ? rowsL[0] : null;
  const row = (r, i) => {
    const s = r.s;
    if (s.status === "loading") return `<tr><td class="rank l-n">${i + 1}</td><td class="l-p"><div class="pname">${esc(r.p.name)}</div></td><td class="l-msg" colspan="4"><span class="loading">Loading…</span></td></tr>`;
    if (s.status === "error" || !s.rank) return `<tr><td class="rank l-n">${i + 1}</td><td class="l-p"><div class="pname">${esc(r.p.name)}</div><div class="handle">${esc(r.p.handle)}</div></td><td class="l-msg" colspan="4"><span class="note">${s.status === "error" ? esc(s.message) : s.gamesNeeded ? `Unrated, ${s.gamesNeeded} more game${s.gamesNeeded === 1 ? "" : "s"} to get a rank` : "Unrated"}</span></td></tr>`;
    const lc = s.lastChange;
    return `<tr>
      <td class="rank l-n">${i + 1}</td>
      <td class="l-p"><div class="who-wrap">${avatarHtml(r.p, 36)}<div class="who-txt"><div class="pname">${esc(r.p.name)} ${streakHtml(r.p)}</div><div class="handle">${esc(r.p.handle)}</div></div></div></td>
      <td class="l-rk"><div class="ladderrank">${rankIcon(s.rank, 40)}<span class="big">${esc(s.rank)}</span></div></td>
      <td class="num l-rr"><span class="big">${s.rr == null ? "—" : s.rr}</span> <span class="rr">RR</span></td>
      <td class="num l-lc">${lc == null ? '<span class="note">—</span>' : `<span class="${lc > 0 ? "good" : lc < 0 ? "bad" : "note"}">${lc > 0 ? "+" : ""}${lc} RR</span>`}</td>
      <td class="l-pk">${s.peak && s.peak.rank ? `<div class="ladderrank small"><span class="note pklabel">Peak</span>${rankIcon(s.peak.rank, 24)}<span>${esc(s.peak.rank)}</span>${s.peak.act ? `<span class="note">${esc(s.peak.act)}</span>` : ""}</div>` : '<span class="note">—</span>'}</td>
    </tr>`;
  };
  return `<section class="panel ladder" aria-label="Rank ladder">
    <div class="toolbar"><div class="grp"><h3>Rank ladder</h3></div><div class="grp"><span class="note">Highest rank first, then most RR${top ? ` · Top: ${esc(top.p.name)}` : ""}</span></div></div>
    <div class="tablewrap"><table class="ld">
      <thead><tr><th>#</th><th>Player</th><th>Current rank</th><th class="num">RR</th><th class="num">Last game</th><th>Peak rank</th></tr></thead>
      <tbody>${rowsL.map(row).join("")}</tbody>
    </table></div>
  </section>`;
}

function playersHtml(){
  const players = state.players.filter(isAuto);
  if (!players.length) return "";
  const statRow = (o, img) => { const pct = o.W / o.n * 100; return `<div class="srow">${img(o.name)}<div class="nm"><div>${esc(o.name)}</div><div class="sub">${o.n} game${o.n === 1 ? "" : "s"}</div></div><div class="pvw"><span class="pv ${pctClass(pct)}">${Math.round(pct)}%</span><div class="sub">${o.W}–${o.L}${o.D ? "–" + o.D : ""}</div></div></div>`; };
  const cards = players.map(p => {
    const s = autoStats(p), w = weekly[p.id] || {status:"loading"}, a = account[p.id];
    const games = scopeGames(p, ui.statScope);
    const agents = topBy(games, "agent"), maps = topBy(games, "map");
    const best = maps.filter(m => m.n >= 3).sort((x,y) => y.W / y.n - x.W / x.n || y.n - x.n)[0];
    const worst = maps.filter(m => m.n >= 3 && m !== best).sort((x,y) => x.W / x.n - y.W / y.n || y.n - x.n)[0];
    const empty = w.status === "loading" ? '<p class="loading">Loading…</p>' : w.status === "error" ? `<p class="note">${esc(w.message)}</p>` : '<p class="note">No games in this range.</p>';
    return `<article class="pcard">
      <div class="pbanner">${a && a.card && a.card.wide ? `<img src="${esc(a.card.wide)}" alt="" loading="lazy">` : ""}</div>
      <div class="pbody">
        <div class="phead">${avatarHtml(p, 48)}<div class="who-txt"><div class="pname">${esc(p.name)} ${streakHtml(p)}</div><div class="handle">${esc(p.handle)}${a && a.level ? ` · Level ${a.level}` : ""}</div></div>
          ${s.rank ? `<div class="prank">${rankIcon(s.rank, 28)}<div><div>${esc(s.rank)}</div><div class="sub">${s.rr == null ? "" : s.rr + " RR"}</div></div></div>` : ""}</div>
        <div class="pcols">
          <div><div class="k">Top agents</div>${agents.length ? agents.slice(0, 3).map(o => statRow(o, agentImg)).join("") : empty}</div>
          <div><div class="k">Top maps</div>${maps.length ? maps.slice(0, 3).map(o => statRow(o, mapImg)).join("") : empty}</div>
        </div>
        ${best ? `<div class="pfoot"><span>Best map: <b>${esc(best.name)}</b> ${best.W}W–${best.L}L</span>${worst ? `<span>Worst: <b>${esc(worst.name)}</b> ${worst.W}W–${worst.L}L</span>` : ""}</div>` : ""}
      </div>
    </article>`;
  }).join("");
  return `<section class="panel players" aria-label="Player cards">
    <div class="toolbar"><div class="grp"><h3>Players</h3></div><div class="grp">${scopeSelect("statscope")}</div></div>
    <div class="pgrid">${cards}</div>
    <div class="banner" style="border-bottom:0;border-top:1px solid var(--line)"><span>Top agents and maps are the most played, from the same HenrikDev match history as the weekly table. Best and worst maps need 3+ games.</span></div>
  </section>`;
}

function mapsHtml(){
  const players = state.players.filter(isAuto);
  if (!players.length) return "";
  const loading = players.some(p => !weekly[p.id] || weekly[p.id].status === "loading");
  const matches = new Map();
  players.forEach(p => scopeGames(p, ui.statScope).forEach(g => {
    if (!g.id || !g.map) return;
    const m = matches.get(g.id) || {map:g.map, results:new Set(), who:[]};
    m.results.add(g.result); m.who.push(p.name); matches.set(g.id, m);
  }));
  const byMap = new Map();
  matches.forEach(m => {
    const o = byMap.get(m.map) || {name:m.map, W:0, L:0, D:0, n:0, vs:0, who:{}};
    m.who.forEach(n => { o.who[n] = (o.who[n] || 0) + 1; });
    if (m.results.size > 1) { o.vs++; byMap.set(m.map, o); return; }
    const r = [...m.results][0]; o[r]++; o.n++; byMap.set(m.map, o);
  });
  const list = [...byMap.values()].filter(o => o.n > 0).sort((a,b) => b.n - a.n || b.W / b.n - a.W / a.n);
  const ranked = list.filter(o => o.n >= 5).sort((a,b) => b.W / b.n - a.W / a.n);
  const best = ranked[0], worst = ranked.length > 1 ? ranked[ranked.length - 1] : null;
  const body = list.length ? list.map(o => {
    const pct = o.W / o.n * 100;
    const fan = Object.entries(o.who).sort((a,b) => b[1] - a[1])[0];
    return `<tr>
      <td class="m-name"><div class="mapcell">${mapImg(o.name)}<span class="pname">${esc(o.name)}</span>${o === best ? '<span class="chip live">Best</span>' : o === worst ? '<span class="chip warn">Worst</span>' : ""}</div></td>
      <td class="num" data-label="Games">${o.n}</td>
      <td class="num" data-label="Record">${o.W}W–${o.L}L${o.D ? `–${o.D}D` : ""}</td>
      <td data-label="Win %"><div class="pct"><span class="big ${pctClass(pct)}">${fmtPct(pct)}</span><span class="bar" style="--c:${pctColor(pct)}"><i style="width:${pct.toFixed(1)}%"></i></span></div></td>
      <td data-label="Played most by">${fan ? `${esc(fan[0])} <span class="note">(${fan[1]})</span>` : "—"}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="5"><span class="note">${loading ? "Loading…" : "No games in this range."}</span></td></tr>`;
  return `<section class="panel mapsec" aria-label="Maps for everyone">
    <div class="toolbar"><div class="grp"><h3>Maps for everyone</h3></div><div class="grp">${scopeSelect("statscope2")}</div></div>
    <div class="tablewrap"><table class="mt">
      <thead><tr><th>Map</th><th class="num">Games</th><th class="num">Record</th><th class="num">Win %</th><th>Played most by</th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <div class="banner" style="border-bottom:0;border-top:1px solid var(--line)"><span>Every ranked game anyone in the group played, counting a game once when friends queued together. Games where friends were on opposite teams are left out. Best and worst need 5+ games.</span></div>
  </section>`;
}

function duosHtml(){
  const players = state.players.filter(isAuto);
  if (players.length < 2) return "";
  const loading = players.some(p => !weekly[p.id] || weekly[p.id].status === "loading");
  const all = players.map(p => ({p, g:gamesOf(p)}));
  const newest = all.flatMap(x => x.g).sort((a,b) => b.start.localeCompare(a.start))[0];
  const act = newest ? newest.act : null;
  const maps = all.map(x => { const m = new Map(); x.g.forEach(g => { if (g.id && (ui.duoScope === "all" || g.act === act)) m.set(g.id, g.result); }); return m; });
  const pairs = [];
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    let W = 0, L = 0, D = 0, vs = 0;
    maps[i].forEach((r, id) => { if (!maps[j].has(id)) return; const r2 = maps[j].get(id); if (r === r2) { if (r === "W") W++; else if (r === "L") L++; else D++; } else vs++; });
    if (W + L + D > 0) pairs.push({a:all[i].p, b:all[j].p, W, L, D, n:W + L + D, vs});
  }
  pairs.sort((x,y) => y.n - x.n || y.W / y.n - x.W / x.n);
  const body = pairs.length ? pairs.map(d => { const pct = d.W / d.n * 100; return `<tr>
      <td class="c-duo"><div class="pname">${esc(d.a.name)} + ${esc(d.b.name)}</div></td>
      <td class="num" data-label="Games">${d.n}</td>
      <td class="num" data-label="Record">${d.W}W–${d.L}L${d.D ? `–${d.D}D` : ""}</td>
      <td data-label="Win %"><div class="pct"><span class="big ${pctClass(pct)}">${fmtPct(pct)}</span><span class="bar" style="--c:${pctColor(pct)}"><i style="width:${pct.toFixed(1)}%"></i></span></div></td>
      <td class="num" data-label="Against each other">${d.vs ? d.vs : '<span class="note">0</span>'}</td>
    </tr>`; }).join("") : `<tr><td colspan="5"><span class="note">${loading ? "Loading…" : "No games played together yet."}</span></td></tr>`;
  return `<section class="panel duos" aria-label="Duo stats">
    <div class="toolbar">
      <div class="grp"><h3>Duos</h3></div>
      <div class="grp"><label for="duoscope">Games from</label><select id="duoscope"><option value="act"${ui.duoScope === "act" ? " selected" : ""}>This act${act ? " (" + esc(act) + ")" : ""}</option><option value="all"${ui.duoScope === "all" ? " selected" : ""}>All stored games</option></select></div>
    </div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Duo</th><th class="num">Games together</th><th class="num">Record</th><th class="num">Win %</th><th class="num">Against each other</th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <div class="banner" style="border-bottom:0;border-top:1px solid var(--line)"><span>Counts ranked games where both players were on the same team. Uses the same HenrikDev match history as the weekly table, so a game HenrikDev missed won't show up here.</span></div>
  </section>`;
}

function awardsHtml(){
  const players = state.players.filter(isAuto);
  if (!players.length) return "";
  const loading = players.some(p => !weekly[p.id] || weekly[p.id].status === "loading");
  const cur = weekKey(new Date()), wk = ui.awardWeek === 1 ? addDays(cur, -7) : cur;
  const st = players.map(p => {
    const g = gamesOf(p).filter(x => weekKey(new Date(x.start)) === wk).reverse();
    let W = 0, L = 0, D = 0, best = 0, run = 0;
    g.forEach(x => { if (x.result === "W") { W++; run++; best = Math.max(best, run); } else { if (x.result === "L") L++; else D++; run = 0; } });
    return {p, W, L, D, n:g.length, best, rate: g.length ? W / g.length * 100 : 0};
  });
  const top = (key, ok) => {
    const c = st.filter(ok || (() => true)); if (!c.length) return null;
    const m = Math.max(...c.map(key)); if (!(m > 0)) return null;
    return {v:m, who:c.filter(x => key(x) === m)};
  };
  const names = r => r.who.map(x => esc(x.p.name)).join(" & ");
  const cards = [
    {k:"Most wins", r:top(x => x.W), v:r => `${r.v} win${r.v === 1 ? "" : "s"}`, d:r => r.who.map(x => `${x.W}W–${x.L}L`).join(", ")},
    {k:"Best win rate", r:top(x => Math.round(x.rate * 10) / 10, x => x.n >= 5), v:r => `${r.v.toFixed(1)}%`, d:r => r.who.map(x => `${x.W}W–${x.L}L`).join(", ") + " · 5+ games", empty:"Nobody has 5 games yet"},
    {k:"Longest win streak", r:top(x => x.best), v:r => `${r.v} in a row`, d:() => "Within this week"},
    {k:"Most games", r:top(x => x.n), v:r => `${r.v} game${r.v === 1 ? "" : "s"}`, d:r => r.who.map(x => `${x.W}W–${x.L}L${x.D ? "–" + x.D + "D" : ""}`).join(", ")}
  ];
  return `<section class="panel awards" aria-label="Weekly awards">
    <div class="toolbar">
      <div class="grp"><h3>Weekly awards</h3></div>
      <div class="grp"><label for="awardweek">Week</label><select id="awardweek"><option value="0"${ui.awardWeek === 0 ? " selected" : ""}>This week (${esc(weekRange(cur))})</option><option value="1"${ui.awardWeek === 1 ? " selected" : ""}>Last week (${esc(weekRange(addDays(cur, -7)))})</option></select></div>
    </div>
    <div class="awardgrid">${cards.map(c => `<div class="award">
      <div class="k">${c.k}</div>
      ${c.r ? `<div class="who">${names(c.r)}</div><div class="v">${c.v(c.r)}</div><div class="n">${c.d(c.r)}</div>` : `<div class="who none">${loading ? "Loading…" : (c.empty || "No games yet")}</div>`}
    </div>`).join("")}</div>
    <div class="banner" style="border-bottom:0;border-top:1px solid var(--line)"><span>Awards reset every Monday at 12:00 AM Pacific time.</span></div>
  </section>`;
}

let weeklyCache = {weeks:[], rows:[]};
function fixFormHtml(rowsW, weeks){
  const pid = ui.fixPid && rowsW.some(r => r.p.id === ui.fixPid) ? ui.fixPid : rowsW[0].p.id;
  const wk = ui.fixWeek && weeks.includes(ui.fixWeek) ? ui.fixWeek : weeks[0];
  ui.fixPid = pid; ui.fixWeek = wk;
  const r = rowsW.find(x => x.p.id === pid), c = r.t[wk], has = r.p.weekFix && r.p.weekFix[wk];
  return `<div class="addform form">
    <h3>Fix a week's record</h3>
    <p class="note">If a game is missing (tracker.gg shows more than this table), enter the real record for that week. If HenrikDev saves the missing game later, it won't be counted twice.</p>
    <div class="row">
      <div class="field"><label for="wf-player">Player</label><select id="wf-player">${rowsW.map(x => `<option value="${x.p.id}"${x.p.id === pid ? " selected" : ""}>${esc(x.p.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="wf-week">Week</label><select id="wf-week">${weeks.map(k => `<option value="${k}"${k === wk ? " selected" : ""}>${esc(weekRange(k))}</option>`).join("")}</select></div>
      <div class="field" style="flex-basis:80px"><label for="wf-w">Wins</label><input id="wf-w" type="number" min="0" step="1" inputmode="numeric" value="${c.W}" data-fresh="1"></div>
      <div class="field" style="flex-basis:80px"><label for="wf-l">Losses</label><input id="wf-l" type="number" min="0" step="1" inputmode="numeric" value="${c.L}" data-fresh="1"></div>
      <div class="field" style="flex-basis:80px"><label for="wf-d">Draws</label><input id="wf-d" type="number" min="0" step="1" inputmode="numeric" value="${c.D}" data-fresh="1"></div>
    </div>
    <p class="err" id="wf-err"></p>
    <div class="row"><button type="button" class="primary" data-act="wfixsave">Save correction</button>${has ? '<button type="button" class="danger" data-act="wfixclear">Remove correction</button>' : ""}</div>
  </div>`;
}

function unpublished(){ return state.updatedAt && state.updatedAt !== publishedAt; }

function ioHtml(){
  return `<div class="io">
    <h3>Publish player changes</h3>
    <p class="note">Everyone sees the player list in your site's data.json file. Stats update on their own, so you only need this after adding, editing or removing players. Press Copy, open data.json in your GitHub repo, click the pencil to edit, select all, paste, and commit. Vercel updates the site in about a minute.</p>
    <textarea id="io-text" spellcheck="false">${esc(JSON.stringify({v:2, updatedAt:state.updatedAt || new Date().toISOString(), players:state.players}, null, 2))}</textarea>
    <p class="err" id="io-err"></p>
    <div class="row"><button type="button" data-act="copy">Copy</button><button type="button" data-act="discard">Discard my local changes</button><button type="button" data-act="closeio">Close</button><p class="note" id="io-msg" aria-live="polite"></p></div>
  </div>`;
}

function render(){
  const list = rows();
  const used = [...new Set(state.players.map(p => p.game))];
  if (ui.game !== "all" && !used.includes(ui.game)) ui.game = "all";
  const focusId = document.activeElement && document.activeElement.id;
  const kept = {};
  root.querySelectorAll("input[id],select[id],textarea[id]").forEach(el => { if (el.id !== "io-text" && !el.dataset.fresh) kept[el.id] = el.value; });
  root.innerHTML = `<div class="wrap">
    <header>
      <div><h1>Ranked Tracker</h1><p class="sub">Ranked wins and games played for each player this season. Valorant stats refresh every time the page opens.</p></div>
      <span class="status" role="status">${esc(ui.status)}</span>
    </header>
    ${tilesHtml()}
    <section class="panel" aria-label="Leaderboard">
      <div class="toolbar">
        <div class="grp">
          <label for="sort">Sort by</label>
          <select id="sort">${[["pct","Win %"],["wins","Wins"],["games","Games played"],["name","Name"]].map(([k,l]) => `<option value="${k}"${ui.sort === k ? " selected" : ""}>${l}</option>`).join("")}</select>
          ${used.length > 1 ? `<label for="gamefilter">Game</label><select id="gamefilter"><option value="all">All games</option>${used.map(k => `<option value="${k}"${ui.game === k ? " selected" : ""}>${esc((GAMES[k] || GAMES.other).label)}</option>`).join("")}</select>` : ""}
        </div>
        <div class="grp">
          <button type="button" data-act="refresh"${refreshing ? " disabled" : ""}>Refresh stats</button>
          <button type="button" data-act="io">${unpublished() ? "Publish changes •" : "Publish changes"}</button>
          <button type="button" class="primary" data-act="add">Add player</button>
        </div>
      </div>
      ${ui.adding ? addFormHtml() : ""}
      ${ui.io ? ioHtml() : ""}
      ${unpublished() && !ui.io ? `<div class="banner"><span>You have player changes that only show in this browser. Publish them so everyone sees them.</span><button type="button" data-act="io">Publish changes</button></div>` : ""}
      ${list.length ? `<div class="tablewrap"><table class="lb">
        <thead><tr><th>#</th><th>Player</th><th>Act</th><th>Rank</th><th class="num">Wins</th><th class="num">Games</th><th class="num">Win %</th><th>Since last visit</th><th></th></tr></thead>
        <tbody>${list.map(rowHtml).join("")}</tbody></table></div>`
      : `<div class="empty">${loaded ? "No players yet. Press Add player and enter their Riot ID." : "Loading players…"}</div>`}
    </section>
    ${ladderHtml()}
    ${playersHtml()}
    ${weeklyHtml()}
    ${mapsHtml()}
    ${duosHtml()}
    ${awardsHtml()}
    <footer>
      <p>Win % is ranked wins divided by ranked games played, so draws count as not won. The act shown is the most recent one each player has played. "Since your last visit" compares against what this browser saw at least 3 hours ago.</p>
      <p>Valorant stats come from Riot's game data through the unofficial HenrikDev API. Each name links to tracker.gg for the full profile.</p>
      <p>Ranked Tracker isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games, VALORANT and all associated properties, including rank icons, are trademarks or registered trademarks of Riot Games, Inc.</p>
    </footer>
  </div>`;
  Object.keys(kept).forEach(k => { const el = document.getElementById(k); if (el) el.value = kept[k]; });
  root.querySelectorAll("select[data-regionrow],select[data-manualrow]").forEach(sel => {
    const r = sel.dataset.regionrow && document.getElementById(sel.dataset.regionrow); if (r) r.hidden = sel.value !== "valorant";
    const m = sel.dataset.manualrow && document.getElementById(sel.dataset.manualrow); if (m) m.hidden = sel.value === "valorant";
  });
  if (focusId) { const el = document.getElementById(focusId); if (el && el.tagName !== "BUTTON") el.focus(); }
}

/* ---------- saving player changes ---------- */
function saveLocal(){
  state.updatedAt = new Date().toISOString();
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e) {}
}
function readCount(raw){ if (String(raw).trim() === "") return null; const n = Number(raw); return Number.isInteger(n) && n >= 0 ? n : NaN; }

function addPlayer(){
  const err = document.getElementById("a-err");
  const name = val("a-name").trim(), game = val("a-game"), handle = val("a-handle").trim();
  const link = game === "valorant" ? "" : val("a-link").trim();
  if (!handle) { err.textContent = game === "valorant" ? "Enter their Riot ID, like Name#NA1." : "Enter their tracker.gg name."; return; }
  if (game === "valorant" && !/^[^#]{1,32}#[^#]{1,8}$/.test(handle)) { err.textContent = "Riot IDs look like Name#TAG, with the # in the middle."; return; }
  if (link && !/^https?:\/\//i.test(link)) { err.textContent = "The profile link should start with https://"; return; }
  if (game === "other" && !link) { err.textContent = "For other games, paste the tracker.gg profile link."; return; }
  const p = {id:uid(), name: name || handle.split("#")[0], game: GAMES[game] ? game : "other", handle, link,
    region: val("a-region") || "na", platform: val("a-platform") === "console" ? "console" : "pc", season:"Current season", snaps:[]};
  if (game !== "valorant") {
    const w = readCount(val("a-w")), g = readCount(val("a-g"));
    if ((w == null) !== (g == null)) { err.textContent = "Enter both wins and games, or leave both empty."; return; }
    if (Number.isNaN(w) || Number.isNaN(g)) { err.textContent = "Wins and games need to be whole numbers, 0 or more."; return; }
    if (w != null && w > g) { err.textContent = "Wins can't be more than games played."; return; }
    if (w != null) p.snaps.push({d:today(), season:p.season, w, p:g});
  }
  state.players.push(p);
  ui.adding = false; saveLocal(); render();
  if (isAuto(p)) loadPlayer(p, true).then(render);
}

function saveDetails(id){
  const p = find(id); if (!p) return;
  const err = document.getElementById("eerr-" + id);
  const name = val("en-" + id).trim(), game = val("eg-" + id), handle = val("eh-" + id).trim(), link = val("el-" + id).trim();
  if (!name) { err.textContent = "Give the player a display name."; return; }
  if (game === "valorant" && !/^[^#]{1,32}#[^#]{1,8}$/.test(handle)) { err.textContent = "Riot IDs look like Name#TAG, with the # in the middle."; return; }
  if (link && !/^https?:\/\//i.test(link)) { err.textContent = "The profile link should start with https://"; return; }
  if (game === "other" && !link) { err.textContent = "For other games, paste the tracker.gg profile link."; return; }
  const changedId = handle !== p.handle || val("ere-" + id) !== p.region || game !== p.game;
  Object.assign(p, {name, game: GAMES[game] ? game : "other", handle, link, region: val("ere-" + id) || p.region, platform: val("epl-" + id) === "console" ? "console" : "pc"});
  saveLocal(); render();
  if (isAuto(p) && changedId) { delete seen[p.id]; delete weekly[p.id]; loadPlayer(p, true).then(render); }
}

function saveUpdate(id){
  const p = find(id); if (!p) return;
  const err = document.getElementById("err-" + id);
  const w = readCount(val("w-" + id)), g = readCount(val("g-" + id));
  const season = val("s-" + id).trim() || p.season || "Current season", d = val("d-" + id) || today();
  if (w == null || g == null) { err.textContent = "Enter both ranked wins and ranked games played."; return; }
  if (Number.isNaN(w) || Number.isNaN(g)) { err.textContent = "Wins and games need to be whole numbers, 0 or more."; return; }
  if (w > g) { err.textContent = "Wins can't be more than games played."; return; }
  const snap = {d, season, w, p:g};
  const i = p.snaps.findIndex(x => x.d === d && x.season === season);
  if (i >= 0) p.snaps[i] = snap; else p.snaps.push(snap);
  p.snaps.sort((a,b) => a.d.localeCompare(b.d)); p.season = season;
  saveLocal(); render();
}

/* ---------- events ---------- */
root.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "addform") addPlayer(); });
root.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "sort") { ui.sort = t.value; render(); return; }
  if (t.id === "gamefilter") { ui.game = t.value; render(); return; }
  if (t.id === "wsort") { ui.wsort = t.value; try { localStorage.setItem("ranked-tracker-wsort", ui.wsort === "total" ? "total" : "week" + ([...Array(12)].findIndex((_, i) => addDays(weekKey(new Date()), -7 * i) === ui.wsort))); } catch(e) {} render(); return; }
  if (t.id === "wf-player" || t.id === "wf-week") { ui.fixPid = val("wf-player"); ui.fixWeek = val("wf-week"); render(); return; }
  if (t.dataset && t.dataset.scope) { ui.statScope = t.value === "all" ? "all" : "act"; render(); return; }
  if (t.id === "awardweek") { ui.awardWeek = Number(t.value) || 0; render(); return; }
  if (t.id === "duoscope") { ui.duoScope = t.value === "all" ? "all" : "act"; render(); return; }
  if (t.id === "weeks") { ui.weeks = Number(t.value) || 6; try { localStorage.setItem("ranked-tracker-weeks", String(ui.weeks)); } catch(e) {} render(); return; }
  if (t.dataset && t.dataset.hint) { const h = document.getElementById(t.dataset.hint); if (h) h.placeholder = (GAMES[t.value] || GAMES.other).hint; }
  if (t.dataset && t.dataset.regionrow) { const r = document.getElementById(t.dataset.regionrow); if (r) r.hidden = t.value !== "valorant"; }
  if (t.dataset && t.dataset.manualrow) { const r = document.getElementById(t.dataset.manualrow); if (r) r.hidden = t.value === "valorant"; }
});
root.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act !== "delete") ui.confirmDel = null;
  switch (act) {
    case "toggle": ui.open = ui.open === id ? null : id; render(); break;
    case "add": ui.adding = true; ui.io = false; render(); { const n = document.getElementById("a-name"); if (n) n.focus(); } break;
    case "canceladd": ui.adding = false; render(); break;
    case "io": ui.io = !ui.io; ui.adding = false; render(); break;
    case "closeio": ui.io = false; render(); break;
    case "refresh": refreshAll(true); break;
    case "wfix": ui.wfix = !ui.wfix; render(); break;
    case "wfixclear": { const p = find(ui.fixPid); if (p && p.weekFix) { delete p.weekFix[ui.fixWeek]; saveLocal(); render(); } break; }
    case "wfixsave": {
      const p = find(ui.fixPid), err = document.getElementById("wf-err"); if (!p) break;
      const W = readCount(val("wf-w")), L = readCount(val("wf-l")), D = readCount(val("wf-d"));
      if ([W, L, D].some(n => n == null || Number.isNaN(n))) { err.textContent = "Enter whole numbers, 0 or more, for wins, losses and draws."; break; }
      p.weekFix = p.weekFix || {}; p.weekFix[ui.fixWeek] = {W, L, D};
      ui.wfix = false; saveLocal(); render(); break;
    }
    case "wsort": ui.wsort = b.dataset.k; try { localStorage.setItem("ranked-tracker-wsort", ui.wsort === "total" ? "total" : "week" + ([...Array(12)].findIndex((_, i) => addDays(weekKey(new Date()), -7 * i) === ui.wsort))); } catch(e) {} render(); break;
    case "retry": { const p = find(id); if (p) { live[id] = {status:"loading"}; render(); loadPlayer(p, true).then(render); } break; }
    case "save": saveUpdate(id); break;
    case "savedetails": saveDetails(id); break;
    case "delete":
      if (ui.confirmDel === id) { state.players = state.players.filter(p => p.id !== id); ui.confirmDel = null; ui.open = null; saveLocal(); render(); }
      else { ui.confirmDel = id; render(); }
      break;
    case "delsnap": { const p = find(id), i = Number(b.dataset.i); if (p && p.snaps[i]) { p.snaps.splice(i, 1); saveLocal(); render(); } break; }
    case "copy": {
      const ta = document.getElementById("io-text"), msg = document.getElementById("io-msg");
      const fallback = () => { ta.select(); msg.textContent = "Text selected. Press Ctrl+C or Cmd+C to copy."; };
      try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = "Copied. Now paste it into data.json on GitHub."; }, fallback); } catch(err) { fallback(); }
      break;
    }
    case "discard":
      try { localStorage.removeItem(LS); } catch(e) {}
      ui.io = false; load(); break;
  }
});

/* ---------- start ---------- */
async function load(){
  let remote = {v:2, updatedAt:"", players:[]};
  try {
    const res = await fetch("data.json", {cache:"no-store"});
    if (res.ok) remote = await res.json();
  } catch(e) {}
  publishedAt = String(remote.updatedAt || "");
  state = {v:2, updatedAt:publishedAt, players:normalize(remote)};
  try {
    const local = JSON.parse(localStorage.getItem(LS) || "null");
    if (local && Array.isArray(local.players) && (local.updatedAt || "") > publishedAt) state = {v:2, updatedAt:local.updatedAt, players:normalize(local)};
    else localStorage.removeItem(LS);
  } catch(e) {}
  loaded = true;
  refreshAll(false);
}
render();
load();
loadAssets();
})();
</script>
</body>
</html>
